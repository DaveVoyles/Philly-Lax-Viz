name: Copy Philly SQLite into Mini volume
description: Replace volume lacrosse.db and restart pll-server

runs:
  using: composite
  steps:
    - name: Copy DB to volume and restart
      shell: bash
      run: |
        test -f data/lacrosse.db
        docker stop pll-server
        docker run --rm \
          -v pll-lax_pll-data:/data \
          -v "${{ github.workspace }}/data:/in" \
          alpine:latest \
          sh -c 'cp /in/lacrosse.db /data/lacrosse.db && chown 100:101 /data/lacrosse.db && chmod 755 /data && chmod 664 /data/lacrosse.db && test -x /data || { echo "FATAL: /data not traversable after chmod" >&2; exit 1; }'
        docker start pll-server
        echo "Wrote pll-lax_pll-data and restarted pll-server"

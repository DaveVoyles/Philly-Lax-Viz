name: sync-logos

# Pull live SQLite from the Mini volume, run logo sync, write DB back.
# Sunday 03:00 America/New_York ~= 07:00 UTC for most of the season.
on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.1'
  DB_LOCAL_PATH: ${{ github.workspace }}/data/lacrosse.db
  LOGOS_LOCAL_DIR: ${{ github.workspace }}/data/logos
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: sync-logos
  cancel-in-progress: false

jobs:
  sync-logos:
    # Self-hosted runner on Mac Mini (myoung34/github-runner Ubuntu Jammy container).
    # See ~/docker-stack/github-runner/docker-compose.yml on the host.
    runs-on: [self-hosted, pll]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pll-copy-db-from-volume

      - name: Backup DB before logo sync
        run: |
          if [ -f "${{ env.DB_LOCAL_PATH }}" ]; then
            cp "${{ env.DB_LOCAL_PATH }}" "${{ env.DB_LOCAL_PATH }}.bak-sync-logos"
            echo "Backup created: ${{ env.DB_LOCAL_PATH }}.bak-sync-logos"
          else
            echo "No DB present yet; skipping backup."
          fi

      - name: Run logo sync
        env:
          DB_PATH: ${{ env.DB_LOCAL_PATH }}
        run: |
          pnpm --filter @pll/ingest sync:logos

      - uses: ./.github/actions/pll-copy-db-to-volume

      - name: Copy logos into running container and Mini clone
        run: |
          if [ -d "${{ env.LOGOS_LOCAL_DIR }}" ]; then
            docker cp "${{ env.LOGOS_LOCAL_DIR }}/." pll-server:/app/data/logos/
            docker run --rm \
              -v /Users/davevoyles/REPOS/Philly-Lax-Viz/data/logos:/dest \
              -v "${{ env.LOGOS_LOCAL_DIR }}:/src" \
              alpine:latest \
              sh -c 'cp -a /src/. /dest/'
          fi

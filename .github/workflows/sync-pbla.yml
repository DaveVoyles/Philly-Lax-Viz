name: sync-pbla

# Scrape PBLA league data from Sportability 12 hours after game nights.
# PBLA games are Mon/Wed evenings -> scrape Tue/Thu at 6AM ET (10:00 UTC).
on:
  schedule:
    - cron: '0 10 * * 2,4'   # Tuesday + Thursday at 10:00 UTC (6AM ET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.1'
  DB_LOCAL_PATH: ${{ github.workspace }}/data/lacrosse.db
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: sync-pbla
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, pll]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pll-copy-db-from-volume

      - name: Sync PBLA data
        env:
          DB_PATH: ${{ env.DB_LOCAL_PATH }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          pnpm --filter @pll/ingest exec tsx src/scripts/syncPbla.ts $FLAGS

      - uses: ./.github/actions/pll-copy-db-to-volume
        if: inputs.dry_run != 'true'

      - name: Check PBLA schedule for new results
        if: inputs.dry_run != 'true'
        id: pbla_check
        continue-on-error: true
        run: pnpm pbla:check

      - name: Warn if new PBLA results need pblaData.ts update
        if: inputs.dry_run != 'true' && steps.pbla_check.outcome == 'failure'
        run: |
          echo "::warning::New PBLA game results detected on Sportability. Update pblaData.ts then run 'pnpm pbla:check -- --save' to sync the snapshot."

      - name: Save updated snapshot
        if: inputs.dry_run != 'true' && steps.pbla_check.outcome == 'failure'
        run: pnpm pbla:check -- --save

      - name: Patch pblaData.ts with new scores
        if: inputs.dry_run != 'true' && steps.pbla_check.outcome == 'failure'
        run: pnpm --filter @pll/ingest exec tsx src/scripts/patchPblaData.ts

      - name: Commit and push pblaData.ts update
        if: inputs.dry_run != 'true' && steps.pbla_check.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/src/views/pblaData.ts data/pbla-2026-snapshot.json
          git diff --staged --quiet || git commit -m "chore(pbla): auto-patch game scores from Sportability $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      - name: Trigger deploy rebuild
        if: inputs.dry_run != 'true' && steps.pbla_check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          gh workflow run deploy.yml --ref main

      - name: Patch missing roster players from Sportability
        if: inputs.dry_run != 'true'
        id: roster_patch
        run: pnpm --filter @pll/ingest exec tsx src/scripts/patchPblaRosters.ts

      - name: Patch player and goalie stats from Sportability
        if: inputs.dry_run != 'true'
        id: stats_patch
        run: pnpm --filter @pll/ingest exec tsx src/scripts/patchPblaStats.ts

      - name: Sync PBLA video IDs from YouTube RSS
        if: inputs.dry_run != 'true'
        id: video_sync
        run: pnpm --filter @pll/ingest exec tsx src/scripts/syncPblaVideos.ts

      - name: Commit and push roster, stats, and video updates
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/src/views/pblaData.ts
          git diff --staged --quiet || (
            git commit -m "chore(pbla): auto-sync rosters, stats, and video IDs from Sportability/YouTube $(date -u +%Y-%m-%d)" &&
            git pull --rebase origin main &&
            git push &&
            sleep 5 &&
            gh workflow run deploy.yml --ref main
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

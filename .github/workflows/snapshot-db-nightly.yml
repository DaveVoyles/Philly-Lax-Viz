name: snapshot-db-nightly

# Off-host SQLite copy: Mini backups dir + NAS.
# ~15 min after ingest-nightly (06:00 UTC). Launchd also runs backup-pll-sqlite.sh at 05:15 local.
on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: snapshot-db-nightly
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: [self-hosted, pll]
    timeout-minutes: 20
    steps:
      - name: Tarball volume onto Mini
        id: tar
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          docker run --rm \
            -v pll-lax_pll-data:/data:ro \
            -v /Users/davevoyles/docker-stack/backups/philly-lax-viz:/out \
            alpine:latest \
            tar czf "/out/pll-${STAMP}.tgz" -C /data .
          ls -l "/Users/davevoyles/docker-stack/backups/philly-lax-viz/pll-${STAMP}.tgz"

      - name: Rsync backups to NAS
        run: |
          docker run --rm \
            -v /Users/davevoyles/docker-stack/backups/philly-lax-viz:/out \
            -v /Users/davevoyles/.ssh:/root/.ssh:ro \
            alpine:latest \
            sh -c 'apk add --no-cache openssh-client rsync >/dev/null
              ssh -p 24 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i /root/.ssh/id_ed25519 dave@192.168.1.8 "mkdir -p /volume1/NetBackup/mac-mini-backups/philly-lax-viz"
              rsync -az -e "ssh -p 24 -o BatchMode=yes -i /root/.ssh/id_ed25519" /out/ dave@192.168.1.8:/volume1/NetBackup/mac-mini-backups/philly-lax-viz/'
          echo "synced pll-${{ steps.tar.outputs.stamp }}.tgz to NAS"
